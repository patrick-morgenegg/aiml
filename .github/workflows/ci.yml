name: CI

on:
  push:
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: App tests (Python/JS agreement, monotonicity, attempt rules)
        run: node --test "app/tests/*.test.js"

  dataset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.2" "numpy>=1.26" "pyarrow>=15"
      - name: Validate the committed sample against the dataset contract
        run: python scripts/validate_dataset.py data/sample/deadlift3_attempts_sample.csv --metadata data/processed/metadata.json
